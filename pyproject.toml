[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-runner"
version = "0.1.0"
description = "Flexible vLLM model server manager"
requires-python = ">=3.12"
dependencies = [
    "vllm>=0.6.0; sys_platform == 'linux'",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
vllm-runner = "vllm_runner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = false
ignore_missing_imports = true
python_version = "3.12"
